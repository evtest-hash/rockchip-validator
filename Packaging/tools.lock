# Pinned manifest of the bundled tools. Packaging/fetch-tools.sh fetches them into Vendor/bin.
#
# Versions are pinned and verified by sha256 rather than tracking latest, because the reports this
# application produces gate material entry into production and every criterion rests on these
# tools' exit codes and structured fields. The tool versions behind a report must therefore be
# identifiable. Tracking latest would make a build depend on whatever the remote held at fetch
# time, breaking that chain; Google's platform-tools-latest is a rolling target, and major adb
# versions have changed behaviour. With versions pinned, any commit builds a byte-identical .app.
#
# To update a tool, change the version, url and sha256 on its line and commit.
#   Obtain the sha256 with: curl -sL <url> | shasum -a 256
#
# Fields: id | version | url | sha256 | members to extract, space separated, kept under their
# original names in Vendor/bin
#
# v3.0 dropped libusb: it reaches USB through IOKit now and links nothing outside the system, so
# the sidecar dylib that used to ship beside it is gone from both the archive and this line. Up to
# v2.7 it had to sit in the same directory as the binary, whose LC_RPATH is @loader_path.

